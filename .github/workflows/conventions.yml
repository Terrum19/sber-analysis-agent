# Правила репозитория: заголовок коммита на английском, описание на русском,
# без упоминаний Claude и служебных файлов .claude/.
# Проверяются только новые коммиты: то, что уже лежит в dev или main, не
# проверяется повторно. Плюс поиск секретов (пароли, токены, ключи) во всей
# истории git с помощью gitleaks: закреплённый бинарник с проверкой
# контрольной суммы, а не gitleaks-action (тому для организаций нужна
# платная лицензия). Обе проверки в одном job: GitHub округляет каждый job
# до минуты, отдельный workflow для секретов стоил бы вторую минуту на
# каждый push.
# Бюджет минут: PR из веток этого же репозитория уже проверены на push, поэтому
# для них job пропускается (0 минут); PR из форков проверяются.
name: Conventions

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pull_request: base..head. push: before..after без коммитов из dev и main
      # (при push в dev или main сама ветка из исключений убирается); для новой
      # ветки или после force-push (before неизвестен) — коммиты, которых нет ни
      # в одной другой удалённой ветке.
      - name: Collect commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git rev-list --reverse "$BASE..$HEAD_SHA" > "$RUNNER_TEMP/commits"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git for-each-ref --format='%(refname)' refs/remotes/origin/dev refs/remotes/origin/main \
              | grep -v -x "refs/remotes/origin/$BRANCH" > "$RUNNER_TEMP/exclude" || true
            xargs -a "$RUNNER_TEMP/exclude" git rev-list --reverse "$BEFORE..$AFTER" --not \
              > "$RUNNER_TEMP/commits"
          else
            git for-each-ref --format='%(refname)' refs/remotes/origin \
              | grep -v -x -e "refs/remotes/origin/$BRANCH" -e "refs/remotes/origin/HEAD" \
              > "$RUNNER_TEMP/others"
            xargs -a "$RUNNER_TEMP/others" git rev-list --reverse "$AFTER" --not \
              > "$RUNNER_TEMP/commits"
          fi
          echo "Коммитов к проверке: $(wc -l < "$RUNNER_TEMP/commits")"

      - name: Check conventions
        run: xargs -a "$RUNNER_TEMP/commits" python3 .github/scripts/check_conventions.py

      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history for secrets
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore
