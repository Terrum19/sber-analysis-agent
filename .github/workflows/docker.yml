# Docker Compose smoke test (issue #6, ключевое для сдачи): образы собираются из
# docker-compose.yml, система поднимается docker compose up с .env.example, бэкенд
# (8000) и фронтенд (3000) отвечают 200 OK, затем docker compose down -v.
# Плюс проверка, что образ бэкенда работает без сети (расширения DuckDB в образе).
# Бюджет минут: тяжёлый workflow — push в dev/main при изменениях, влияющих на
# образы, PR из форков и ручной запуск; слои кэшируются в GitHub Actions cache.
name: Docker

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Docker Compose smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env and validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build images from docker-compose.yml
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max

      - name: Offline check (no network)
        run: |
          docker run --rm --network none sber-backend:local python -c '
          import duckdb
          con = duckdb.connect()
          con.execute("LOAD postgres_scanner")
          print("postgres_scanner загружается без сети")
          '

      - name: docker compose up
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          echo "frontend: HTTP $code"
          test "$code" = 200

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: docker compose down
        if: always()
        run: docker compose down -v
