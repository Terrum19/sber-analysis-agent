# Бэкенд: ruff, модульные тесты под coverage и интеграционные тесты с живыми СУБД.
# Бюджет минут: push при изменениях бэкенда, Python 3.11 (как в Docker-образе) без
# матрицы, отмена устаревших запусков. PR из веток этого же репозитория уже
# проверены на push, поэтому для них job пропускается (0 минут); PR из форков
# проверяются.
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "scripts/eval.py"
      - "data/eval/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/eval.py"
      - "data/eval/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint & unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # WASM-песочница (issue #26): Pyodide под Node.js 20 и колёса пакетов анализа
      # данных; без них тесты песочницы пропускаются, поэтому ставим их всегда.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/sandbox/package-lock.json

      - name: Install Pyodide runtime
        working-directory: backend/sandbox
        run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: backend/sandbox/node_modules/pyodide/*.whl
          key: pyodide-wheels-${{ hashFiles('backend/sandbox/package-lock.json', 'backend/sandbox/fetch_packages.py') }}

      - name: Fetch Pyodide packages
        run: python sandbox/fetch_packages.py

      - name: Ruff
        run: |
          ruff check app tests ../scripts/eval.py
          ruff format --check app tests ../scripts/eval.py

      - name: Unit tests under coverage
        run: coverage run -m pytest -q --strict-markers -m "not integration and not benchmark"

      # Eval (#57) на FakeLLM: по вопросу на сценарий над демо-таблицей, чтобы
      # scripts/eval.py и формат data/eval/questions.yaml не ломались. Качество здесь
      # не меряется: FakeLLM на любой вопрос строит один и тот же план. Ненулевой
      # код — только если ход упал внутри скрипта. Без набора (#56) шаг пропускается.
      - name: Eval on FakeLLM
        if: hashFiles('data/eval/questions.yaml') != ''
        run: |
          python ../scripts/eval.py --fake --per-scenario 1 \
            --csv ../data/sample_datasets/demo_events.csv --dataset demo_events \
            --db "$RUNNER_TEMP/eval.duckdb" --out-dir "$RUNNER_TEMP/eval"
          cat "$RUNNER_TEMP"/eval/eval_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

      # Общий порог — fail_under в pyproject.toml (храповик: поднимать по мере реализации
      # заглушек round-2). Код коннектора PostgreSQL и профилирования держим на 100%.
      - name: Coverage gate
        run: |
          coverage report
          coverage report --fail-under=100 --include="app/core/data/connectors/pg_dsn.py,app/core/data/connectors/postgres.py,app/core/data/connectors/clickhouse.py,app/core/data/connectors/factory.py,app/api/deps.py,app/core/data/profiling.py,app/core/data/semantic_select.py,app/core/memory/profile_memory.py,app/core/data/schema_enrichment.py,app/core/viz/vega_spec_builder.py,app/core/viz/chart_morph.py,app/core/agent/orchestrator.py,app/core/memory/session_memory.py,app/core/memory/state_cache.py"

      # Неблокирующий бенчмарк профилирования (issue #6): 1 000 000 × 50 колонок, только замер.
      # Лимит 10 с проверяет tests/benchmark локально: у раннеров приватного репозитория
      # 2 vCPU, на них лимит давал бы ложные срабатывания. Результат — в summary и артефакте.
      - name: Profiling benchmark
        if: always()
        continue-on-error: true
        run: |
          python ../scripts/run_profile_benchmark.py --output profile_benchmark.json \
            > profile_benchmark.md
          status=$?
          { echo "### Бенчмарк профилирования"; cat profile_benchmark.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-benchmark
          path: backend/profile_benchmark.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage HTML
        if: failure()
        run: coverage html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coverage-html
          path: backend/htmlcov
          retention-days: 7

  integration:
    name: Integration tests (live databases)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sber
          POSTGRES_PASSWORD: sber
          POSTGRES_DB: sber_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sber -d sber_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: sber
          CLICKHOUSE_PASSWORD: sber
          CLICKHOUSE_DB: sber_demo
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://sber:sber@localhost:5432/sber_demo
      TEST_CLICKHOUSE_DSN: clickhouse://sber:sber@localhost:9000/sber_demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Integration tests
        run: pytest -q -rs --strict-markers -m integration
