# Еженедельная проверка зависимостей бэкенда на известные уязвимости (pip-audit,
# база PyPA). Плюс запуск при изменении requirements.txt. ~2 минуты в неделю.
name: Dependency audit

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths:
      - "backend/requirements.txt"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --progress-spinner off --desc on
