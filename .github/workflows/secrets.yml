# Поиск секретов (пароли, токены, ключи) во всей истории git с помощью gitleaks.
# Используется закреплённый бинарник с проверкой контрольной суммы, а не
# gitleaks-action (тому для организаций нужна платная лицензия).
# Дёшево: сканирование всей истории занимает секунды.
name: Secrets

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
