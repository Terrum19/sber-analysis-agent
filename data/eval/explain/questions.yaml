# Разговорные ходы: вопрос о прошлом ответе агента, а не о данных (#A-23).
# Набор проверяет маршрут хода: пояснение отвечается по журналу хода без
# шагов, вопрос к данным («почему упало», «как распределена») — планом.
# expect.route: answer — ответ без шагов; data — ход с шагами; без route —
# годится любой маршрут (оба ответа честные). Ловушки:
# ложные посылки («почему ты исключил Москву»), вопросы без истории,
# «как»/«объясни»/«почему» в вопросах к данным, смешанные просьбы.

# --- A. Пояснение расчёта и пересчёт ---

- id: a0-revenue-channels
  scenario: 11
  dataset: t_01_prodazhi
  question: "Какая выручка по каналам продаж за 2025 год?"
  expect: {route: data}

- id: a1-how
  scenario: 11
  dataset: t_01_prodazhi
  follow_up_of: a0-revenue-channels
  question: "Как ты это посчитал?"
  expect: {route: answer}

- id: a2-returns
  scenario: 11
  dataset: t_01_prodazhi
  follow_up_of: a1-how
  question: "Ты учитывал возвраты?"
  expect: {route: answer}

- id: a3-recompute
  scenario: 11
  dataset: t_01_prodazhi
  follow_up_of: a2-returns
  question: "Тогда пересчитай без возвратов"
  expect: {route: data}

