# --- 9. Корреляции и лаги ---

- id: tasks-s9-effort
  scenario: 9
  dataset: t_03_zadachi_komand
  question: "Связаны ли плановые и фактические трудозатраты?"
  expect:
    numbers: {sql: "SELECT corr(\"Плановые трудозатраты, ч\", \"Фактические трудозатраты, ч\") FROM t_03_zadachi_komand", tolerance_abs: 0.05}
    columns_all: ["Плановые трудозатраты, ч", "Фактические трудозатраты, ч"]
  judge: [causation_caveat]

- id: ads-s9-lag
  scenario: 9
  dataset: t_06_reklamnye_kampanii
  question: "Рост расходов на рекламу предшествует росту выручки по рекламе? Есть ли лаг в днях?"
  expect:
    columns_all: ["Дата", "Расходы, руб.", "Выручка по рекламе, руб."]
  judge: [causation_caveat, numbers_grounded]

# --- 10. Прогноз ---

- id: sales-s10-forecast
  scenario: 10
  dataset: t_01_prodazhi
  question: "Какую выручку ожидать в ближайшем квартале при текущих условиях?"
  expect:
    range:
      # Ближайший квартал — IV 2026; ориентиры: III 2026 факт и IV 2025 факт.
      sql: >-
        SELECT 0.8 * min(v), 1.3 * max(v) FROM (
          SELECT sum("Количество, шт." * "Цена до скидки за единицу, руб." * (1 - "Скидка, %" / 100)) v
          FROM t_01_prodazhi WHERE "Тип операции" = 'Продажа'
            AND ("Дата операции (МСК)" >= '2026-07-01' OR
                 "Дата операции (МСК)" BETWEEN '2025-10-01' AND '2025-12-31 23:59:59')
          GROUP BY "Дата операции (МСК)" >= '2026-07-01')
  judge: [forecast_caveat]

- id: ads-s10-whatif
  scenario: 10
  dataset: t_06_reklamnye_kampanii
  question: "Как изменится выручка по рекламе, если увеличить расходы на 20%?"
  judge: [forecast_caveat, numbers_grounded]

