- id: meds-s7-antihistamine
  scenario: 7
  dataset: t_09_lekarstvennye_preparaty
  question: "Какой паттерн повторяется каждые 12 месяцев у антигистаминных средств?"
  judge: [spring_peak]
  notes: "Лоратадин и цетиризин — пик в апреле–мае, примерно вдвое выше зимы."

- id: sales-s7-peak-month
  scenario: 7
  dataset: t_01_prodazhi
  question: "В какой месяц года выручка максимальна?"
  expect:
    contains_any: ["декабр"]

# --- 8. Сегменты ---

- id: ads-s8-platforms
  scenario: 8
  dataset: t_06_reklamnye_kampanii
  question: "Чем отличаются рекламные площадки по эффективности?"
