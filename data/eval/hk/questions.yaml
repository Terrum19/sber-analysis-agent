# --- 6. Диалог с контекстом ---

- id: sales-s6-channels
  scenario: 6
  dataset: t_01_prodazhi
  question: "Какая выручка по каналам продаж?"
  expect:
    numbers:
      any_of:
        - sql: >-
            SELECT sum("Количество, шт." * "Цена до скидки за единицу, руб." * (1 - "Скидка, %" / 100))
            FROM t_01_prodazhi WHERE "Тип операции" = 'Продажа' GROUP BY "Канал продажи"
        - sql: >-
            SELECT sum("Количество, шт." * "Цена до скидки за единицу, руб." * (1 - "Скидка, %" / 100))
            FROM t_01_prodazhi GROUP BY "Канал продажи"

- id: sales-s6-channels-morph
  scenario: 6
  dataset: t_01_prodazhi
  follow_up_of: sales-s6-channels
  question: "А теперь покажи то же самое в другом виде"
  expect:
    chart_changed: true

- id: support-s6-priority
  scenario: 6
  dataset: t_02_tekhnicheskaya_podderzhka
  question: "Сколько обращений по каждому приоритету?"
  expect:
    numbers: {sql: "SELECT count(*) FROM t_02_tekhnicheskaya_podderzhka GROUP BY Приоритет"}

- id: support-s6-priority-payment
  scenario: 6
  dataset: t_02_tekhnicheskaya_podderzhka
  follow_up_of: support-s6-priority
  question: "А теперь то же самое только для темы «Оплата»"
  expect:
    numbers: {sql: "SELECT count(*) FROM t_02_tekhnicheskaya_podderzhka WHERE Тема = 'Оплата' GROUP BY Приоритет"}

- id: support-s6-second-item
  scenario: 6
  dataset: t_02_tekhnicheskaya_podderzhka
  follow_up_of: support-s6-priority-payment
  question: "Расскажи подробнее про второй пункт"
  judge: [follows_context]

# --- 7. Повторяющиеся закономерности во времени ---

- id: meds-s7-winter
  scenario: 7
  dataset: t_09_lekarstvennye_preparaty
  question: "Есть ли сезонные пики продаж лекарств зимой?"
  judge: [winter_peak, numbers_grounded]
