# Eval-набор по датасетам организаторов (gitverse.ru/kban/HK_Datasets).
# Сценарии 1–10 — из README организаторов, 0 — «неудобные» (тех. критерий 8).
# Формат и проверки — data/eval/hk/README.md. Эталоны gold.sql считаются
# по сырым CSV (scripts/eval/gold.py), не по базе агента.

# --- 1. Первичное знакомство ---

- id: sales-s1-overview
  scenario: 1
  dataset: t_01_prodazhi
  question: "Что передо мной? Что это за данные, за какой период и сколько в них записей?"
  expect:
    numbers: {sql: "SELECT count(*) FROM t_01_prodazhi"}
    contains_all: [["2024"], ["2026"]]
    contains_any_groups: [["октябр", "10.2024", "2024-10"], ["сентябр", "09.2026", "2026-09", "30.09"]]
  judge: [describes_domain, period_full]

- id: delivery-s1-overview
  scenario: 1
  dataset: t_04_dostavka
  question: "Что есть в этих данных?"
  expect:
    contains_any: ["отправлен", "доставк", "посыл"]
  judge: [describes_domain]

- id: meds-s1-size
  scenario: 1
  dataset: t_09_lekarstvennye_preparaty
  question: "За какой период эти данные и сколько в них аптек и лекарств?"
  expect:
    numbers: {sql: "SELECT count(DISTINCT ID_Аптеки), count(DISTINCT ID_Лекарства) FROM t_09_lekarstvennye_preparaty"}
    contains_all: [["2024"], ["2026"]]
  judge: [period_full]

# --- 2. Вопросы по содержанию ---

- id: sales-s2-field
  scenario: 2
  dataset: t_01_prodazhi
  question: "Что означает поле «Код исходной позиции»?"
  expect:
    contains_any: ["возврат"]
    columns_all: ["Код исходной позиции"]
  judge: [field_meaning]

- id: support-s2-top-topics
  scenario: 2
  dataset: t_02_tekhnicheskaya_podderzhka
  question: "Какие темы обращений встречаются чаще всего?"
  expect:
    numbers: {sql: "SELECT count(*) FROM t_02_tekhnicheskaya_podderzhka GROUP BY Тема ORDER BY 1 DESC LIMIT 3"}
    contains_all: [["доставк"], ["оплат"]]
    columns_all: ["Тема"]

- id: jobs-s2-chain
  scenario: 2
  dataset: t_08_fonovye_zadaniya
  question: "Что связывает записи с одинаковым «Код цепочки запусков»?"
  expect:
    contains_any: ["попытк", "повтор", "перезапуск", "ретра"]
    columns_all: ["Код цепочки запусков"]
  judge: [field_meaning]

- id: purchases-s2-rejected
  scenario: 2
  dataset: t_07_zayavki_na_zakupku
  question: "Какая средняя запрошенная сумма заявки и какая доля заявок отклонена?"
  expect:
    numbers:
      sql: >-
        SELECT avg("Запрошенная сумма, руб."),
               100.0 * count(*) FILTER (WHERE Статус = 'Отклонена') / count(*)
        FROM t_07_zayavki_na_zakupku
    columns_all: ["Запрошенная сумма, руб.", "Статус"]

# --- 3. Группировки и аномалии ---

- id: sales-s3-july
  scenario: 3
  dataset: t_01_prodazhi
  question: "Что происходит с выручкой каждый июль?"
  expect:
    columns_all: ["Дата операции (МСК)", "Количество, шт.", "Цена до скидки за единицу, руб."]
  judge: [july_not_special, numbers_grounded]
  notes: >-
    Июль ничем не выделяется (210 млн при среднем месяце ~225 млн); пик — декабрь.
    Правильный ответ — «ничего особенного», а не выдуманный сезонный эффект.

- id: events-s3-duplicates
  scenario: 3
  dataset: t_05_sobytiya_prilozheniya
  question: "Есть ли тут повторяющиеся данные?"
  expect:
    contains_any: ["нет", "не найден", "не обнаружен", "отсутству", "0 "]
  judge: [duplicates_none]
  notes: "Полных дублей строк нет, коды событий уникальны."

- id: jobs-s3-failing
  scenario: 3
  dataset: t_08_fonovye_zadaniya
  question: "Какие задания падают чаще всего?"
  expect:
    contains_any_sql: "SELECT Задание FROM t_08_fonovye_zadaniya WHERE Статус = 'Ошибка' GROUP BY Задание ORDER BY count(*) DESC LIMIT 1"
    columns_all: ["Задание", "Статус"]
  judge: [rate_vs_count]
  notes: >-
    По числу ошибок лидирует «Отправка уведомлений о заказах» (5817), но её просто
    чаще запускают: доля ошибок у всех заданий ~8 %. Хороший ответ это замечает.

- id: delivery-s3-late-carrier
  scenario: 3
  dataset: t_04_dostavka
  question: "Какой перевозчик чаще всех опаздывает относительно обещанного срока?"
  expect:
    numbers:
      sql: >-
        SELECT 100 * avg(("Доставлено (МСК)" > "Обещанный срок (МСК)")::int)
        FROM t_04_dostavka WHERE "Доставлено (МСК)" IS NOT NULL
      tolerance: 0.05
    columns_all: ["Перевозчик", "Доставлено (МСК)", "Обещанный срок (МСК)"]
  judge: [no_real_difference]
  notes: >-
    Опаздывают все примерно одинаково: 8,36–8,55 % доставленных. Назвать «лидера»
    без оговорки о мизерной разнице — слабый ответ.

# --- 4. Визуализация ---

- id: sales-s4-categories
  scenario: 4
  dataset: t_01_prodazhi
  question: "Покажи наглядно, как выручка распределена по категориям товаров"
  expect:
    chart_any: [bar]
    numbers:
      any_of:
        - sql: >-
            SELECT sum("Количество, шт." * "Цена до скидки за единицу, руб." * (1 - "Скидка, %" / 100))
            FROM t_01_prodazhi WHERE "Тип операции" = 'Продажа'
            GROUP BY "Категория товара" ORDER BY 1 DESC LIMIT 1
        - sql: >-
            SELECT sum("Количество, шт." * "Цена до скидки за единицу, руб." * (1 - "Скидка, %" / 100))
            FROM t_01_prodazhi GROUP BY "Категория товара" ORDER BY 1 DESC LIMIT 1
  judge: [chart_fits]

- id: delivery-s4-weight
  scenario: 4
  dataset: t_04_dostavka
  question: "Покажи распределение веса отправлений"
  expect:
    chart_any: [histogram, box]
    columns_all: ["Вес, кг"]
  judge: [chart_fits]

- id: ads-s4-spend-monthly
  scenario: 4
  dataset: t_06_reklamnye_kampanii
  question: "Как менялись расходы на рекламу по месяцам? Покажи графиком"
  expect:
    chart_any: [line, area, bar]
    columns_all: ["Дата", "Расходы, руб."]
  judge: [chart_fits]

