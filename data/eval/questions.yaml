- id: sales-margin
  scenario: 3
  dataset: t_01_prodazhi
  question: "Какая категория товара приносит больше всего маржи по продажам без возвратов? Маржа = количество × (цена до скидки × (1 − скидка/100) − себестоимость единицы)."
  follow_up_of: null
  expect:
    tools_any: [create_column, group_by, filter_rows, sort_limit]
    columns_all: ["Категория товара", "Количество, шт.", "Цена до скидки за единицу, руб.",
                  "Скидка, %", "Себестоимость единицы, руб.", "Тип операции"]
    answer_contains: []
    value:
      sql: >-
        SELECT "Категория товара" FROM t_01_prodazhi WHERE "Тип операции" = 'Продажа'
        GROUP BY 1 ORDER BY sum("Количество, шт." * ("Цена до скидки за единицу, руб."
        * (1 - "Скидка, %" / 100.0) - "Себестоимость единицы, руб.")) DESC LIMIT 1
      tolerance: 0
    chart_type_any: [bar, table]
    refusal: false

