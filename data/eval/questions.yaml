# --- Сценарий 3. Группировки и аномалии ---

- id: sales-03
  scenario: 3
  dataset: t_01_prodazhi
  question: "Что происходит с продажами каждый декабрь? Сравни число проданных штук по месяцам года, все годы вместе."
  follow_up_of: null
