# Опц.: раздача фронта и проксирование API при деплое (nginx).
# В замкнутом контуре API проксируется Next.js rewrites — nginx не обязателен.
server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # SSE: отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
