# Запуск из релизного архива без сборки и без доступа в интернет.
# Образы загружаются из архивов релиза:
#   docker load -i sber-backend-<версия>.tar.gz
#   docker load -i sber-frontend-<версия>.tar.gz
#   cp .env.example .env
#   SBER_VERSION=<версия> docker compose -f docker-compose.release.yml --profile cpu up -d
#   (на GPU NVIDIA — --profile gpu и LLM_MODEL=<модель для GPU>)
# LLM — Ollama, как в docker-compose.yml. Без интернета образ ollama/ollama и том
# ollama-models с моделью должны прийти из архива релиза (#82); рядом с этим файлом
# нужен infra/ollama/entrypoint.sh.

x-ollama: &ollama
  image: ollama/ollama:0.35.1
  entrypoint: ["/bin/sh", "/entrypoint.sh"]
  environment:
    LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
    EMBED_MODEL: ${EMBED_MODEL:-}
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  volumes:
    - ollama-models:/root/.ollama
    - ./infra/ollama/entrypoint.sh:/entrypoint.sh:ro
  networks:
    default:
      aliases: [ollama]
  healthcheck:
    test: ["CMD-SHELL", "ollama list | grep -qF \"$$LLM_MODEL\""]
    interval: 15s
    timeout: 10s
    retries: 3
    start_period: 1h
    start_interval: 5s

services:
  ollama-cpu:
    <<: *ollama
    profiles: [cpu]

  ollama-gpu:
    <<: *ollama
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: sber-backend:${SBER_VERSION:?укажите SBER_VERSION, например v0.1.0}
    env_file: .env
    # Пути данных внутри контейнера — на смонтированном томе /app/storage
    # (относительные пути из .env рассчитаны на запуск из корня репозитория).
    environment:
      STORAGE_DIR: /app/storage
      DUCKDB_PATH: /app/storage/duckdb/main.duckdb
      SQLITE_PATH: /app/storage/sessions/sessions.sqlite
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data:ro
    depends_on:
      ollama-cpu:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false

  frontend:
    image: sber-frontend:${SBER_VERSION:?укажите SBER_VERSION, например v0.1.0}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  ollama-models:
