# Запуск из релизного архива без сборки и без доступа в интернет.
# Образы загружаются из архивов релиза:
#   docker load -i sber-backend-<версия>.tar.gz
#   docker load -i sber-frontend-<версия>.tar.gz
#   SBER_VERSION=<версия> docker compose -f docker-compose.release.yml up -d
# LLM — Ollama на хосте, как в docker-compose.yml (#167); без интернета модель
# LLM_MODEL должна уже быть в этой Ollama. Ollama в контейнере — профиль ollama
# (или ollama-gpu) и COMPOSE_LLM_BASE_URL=http://ollama:11434/v1; тогда образ
# ollama/ollama и том ollama-models с моделью приходят из архива релиза (#82),
# infra/ollama/entrypoint.sh лежит в архиве рядом с этим файлом.

x-ollama: &ollama
  image: ollama/ollama:0.35.1
  entrypoint: ["/bin/sh", "/entrypoint.sh"]
  environment:
    LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
    EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  volumes:
    - ollama-models:/root/.ollama
    - ./infra/ollama/entrypoint.sh:/entrypoint.sh:ro
  networks:
    default:
      aliases: [ollama]
  healthcheck:
    test: ["CMD", "/bin/sh", "/entrypoint.sh", "check"]
    interval: 15s
    timeout: 10s
    retries: 3
    start_period: 1h
    start_interval: 5s

services:
  ollama-cpu:
    <<: *ollama
    profiles: [ollama]

  ollama-gpu:
    <<: *ollama
    profiles: [ollama-gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: sber-backend:${SBER_VERSION:?укажите SBER_VERSION, например v0.1.0}
    env_file:
      - path: .env
        required: false
    # Пути данных внутри контейнера — на смонтированном томе /app/storage
    # (относительные пути из .env рассчитаны на запуск из корня репозитория).
    environment:
      STORAGE_DIR: /app/storage
      DUCKDB_PATH: /app/storage/duckdb/main.duckdb
      SQLITE_PATH: /app/storage/sessions/sessions.sqlite
      LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      # Бэкенд ждёт тот же контекст, что задан Ollama (#102).
      LLM_NUM_CTX: ${OLLAMA_CONTEXT_LENGTH:-16384}
      # Эмбеддинги — с той же Ollama: переход к другим данным по смыслу вопроса.
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data:ro
    depends_on:
      ollama-cpu:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false

  frontend:
    image: sber-frontend:${SBER_VERSION:?укажите SBER_VERSION, например v0.1.0}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  ollama-models:
