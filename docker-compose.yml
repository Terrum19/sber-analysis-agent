# Локальный подъём в замкнутом контуре.
# LLM (Qwen) — отдельно на хосте (Ollama/vLLM), чтобы не тащить веса в compose.
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Демо/тестовый PostgreSQL для коннектора postgres_scanner (tests/integration).
  # Платформа читает его только в режиме READ_ONLY; бекенд от него не зависит.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sber
      POSTGRES_PASSWORD: sber
      POSTGRES_DB: sber_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sber -d sber_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres-data:
